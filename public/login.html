<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara's Best - Login / Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8B4513; --primary-light: #d2691e; --primary-accent: #fcf8f2; --text-main: #2d1e18; --text-muted: #7c6e65; --surface: #ffffff; --border: #e6ded9; --radius: 12px; --shadow: 0 10px 30px rgba(139, 69, 19, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #fcf8f2 0%, #f5e6d3 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: var(--text-main); }
        .auth-container { background: var(--surface); padding: 40px; border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 420px; border-top: 6px solid var(--primary); }
        .brand-header { text-align: center; margin-bottom: 28px; }
        .brand-header h1 { font-size: 24px; font-weight: 700; color: var(--primary); }
        .tabs { display: flex; margin-bottom: 28px; background: var(--primary-accent); padding: 6px; border-radius: 8px; border: 1px solid var(--border); }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-muted); border-radius: 6px; transition: 0.3s; }
        .tab.active { color: var(--primary); background: var(--surface); box-shadow: 0 2px 8px rgba(139, 69, 19, 0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(210, 105, 30, 0.15); }
        button { width: 100%; background: var(--primary-light); color: white; border: none; padding: 14px; font-size: 15px; cursor: pointer; border-radius: 8px; font-weight: 700; transition: 0.3s; }
        button:hover:not(:disabled) { background: var(--primary); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .hidden { display: none; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .toast { background: #333; color: white; padding: 12px 24px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="toast-container" id="toast-wrapper"></div>

<div class="auth-container">
    <div class="brand-header">
        <h1>Clara's Best</h1>
        <p>Premium Filipino Delicacies</p>
    </div>

    <div class="tabs">
        <div class="tab active" id="login-tab" onclick="switchTab('login')">Login</div>
        <div class="tab" id="signup-tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group"><label>Email Address</label><input type="email" id="login-email" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="login-password" required></div>
        <button type="submit" id="login-btn">Sign In</button>
    </form>

    <form id="signup-form" class="hidden" onsubmit="handleSignup(event)">
        <div class="form-group"><label>Full Name</label><input type="text" id="signup-name" required></div>
        <div class="form-group"><label>Email Address</label><input type="email" id="signup-email" required></div>
        <div class="form-group"><label>Mobile Number</label><input type="tel" id="signup-phone" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="signup-password" required></div>
        <button type="submit" id="signup-btn">Create Account</button>
    </form>
</div>

<script>
    function showToast(message, isSuccess = true) {
        const wrapper = document.getElementById('toast-wrapper');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isSuccess ? '#e8f5e9' : '#ffebee';
        toast.style.color = isSuccess ? '#1b5e20' : '#c62828';
        toast.innerText = message;
        wrapper.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    function switchTab(type) {
        document.getElementById('login-form').classList.toggle('hidden', type !== 'login');
        document.getElementById('signup-form').classList.toggle('hidden', type !== 'signup');
        document.getElementById('login-tab').classList.toggle('active', type === 'login');
        document.getElementById('signup-tab').classList.toggle('active', type === 'signup');
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        btn.disabled = true; btn.innerText = "Processing...";
        
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('login-email').value, password: document.getElementById('login-password').value })
            });
            const data = await res.json();
            if (res.ok) {
                showToast('Login successful!');
                setTimeout(() => window.location.href = data.role === 'Admin' ? '/admin.html' : data.role === 'Staff' ? '/staff.html' : '/customer.html', 1000);
            } else { showToast(data.error || 'Login failed', false); btn.disabled = false; btn.innerText = "Sign In"; }
        } catch (err) { showToast("Connection error", false); btn.disabled = false; btn.innerText = "Sign In"; }
    }

    async function handleSignup(e) {
        e.preventDefault();
        const btn = document.getElementById('signup-btn');
        btn.disabled = true; btn.innerText = "Processing...";
        
        try {
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: document.getElementById('signup-name').value, email: document.getElementById('signup-email').value, phone: document.getElementById('signup-phone').value, password: document.getElementById('signup-password').value })
            });
            if (res.ok) {
                showToast('Registration successful!');
                setTimeout(() => { document.getElementById('signup-form').reset(); switchTab('login'); btn.disabled = false; btn.innerText = "Create Account"; }, 1500);
            } else { showToast("Registration failed", false); btn.disabled = false; btn.innerText = "Create Account"; }
        } catch (err) { showToast("Connection error", false); btn.disabled = false; btn.innerText = "Create Account"; }
    }
</script>
</body>
</html>
