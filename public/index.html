<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLARA'S BEST: Kakanin Delicacies</title>
    <style>
        /* Modern Premium Tropical & Glassmorphism Design System */
        :root {
            --primary: #5c2c06;        /* Deep Roast Espresso Brown */
            --primary-light: #8b4513;  /* Warm Saddle Brown */
            --accent: #e67e22;         /* Toasted Sweet Rice Caramel */
            --accent-hover: #d35400;   /* Deep Caramel */
            --text-main: #231204;      /* High contrast dark espresso */
            --text-muted: #594636;     /* Muted earth tone */
            
            /* Glassmorphism values */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-header: rgba(24, 13, 5, 0.88);
            
            --radius-md: 12px;
            --radius-lg: 20px;
            --card-shadow: 0 8px 32px 0 rgba(44, 23, 6, 0.08);
            --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            color: var(--text-main); 
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            
            /* High-quality culinary banner backdrop */
            background-image: linear-gradient(rgba(44, 23, 6, 0.4), rgba(44, 23, 6, 0.25)), 
                              url('https://images.unsplash.com/photo-1621263764928-df1444c5e859?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Core Layout Container with Frosting Overlay Backdrop */
        .main-wrapper {
            max-width: 1140px;
            margin: 40px auto;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* Responsive structural scaling layout wrapper rules */
        @media (max-width: 768px) {
            .main-wrapper {
                margin: 0;
                border-radius: 0;
                padding: 20px;
            }
        }

        /* Brand Luxury Header Section */
        header { 
            background: var(--glass-header);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white; 
            padding: 45px 30px; 
            text-align: center; 
            border-radius: var(--radius-lg); 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 14px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .info-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px 30px;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .info { 
            color: #fbecc5; 
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        
        /* Interactive Nav Link State Status Window */
        .nav-status { 
            margin-top: 25px; 
            text-align: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding-top: 20px;
            font-size: 0.95rem;
        }

        .nav-status a { 
            color: var(--accent); 
            font-weight: 600; 
            text-decoration: none; 
            margin-left: 20px; 
            padding: 8px 16px;
            border-radius: var(--radius-md);
            transition: all var(--transition-smooth);
            display: inline-block;
        }

        .nav-status a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 30px;
            color: var(--primary);
            position: relative;
            display: inline-block;
            padding-bottom: 8px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 4px;
            background-color: var(--accent);
            border-radius: 2px;
        }

        /* Modern Elastic Grid System layout rules */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }

        /* Crisp Micro-Interactive White Product Panels */
        .card { 
            background: rgba(255, 255, 255, 0.9); 
            border: 1px solid rgba(92, 44, 6, 0.12); 
            padding: 32px 24px; 
            border-radius: var(--radius-lg); 
            text-align: center; 
            box-shadow: var(--card-shadow); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth);
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 15px 35px rgba(44, 23, 6, 0.12);
        }

        .card h3 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .card .description {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 22px;
            min-height: 72px; /* Standardized fluid structural alignment rules */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card .price-tag {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-light);
            margin-bottom: 6px;
        }

        .card .stock-tag {
            font-size: 0.85rem;
            font-weight: 700;
            color: #7c5e43;
            background-color: #f5ece4;
            padding: 5px 14px;
            border-radius: 30px;
            margin-bottom: 24px;
            display: inline-block;
        }

        /* Tactile Flat Order Action Controls */
        button { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            font-size: 0.95rem;
            font-weight: 700;
            width: 100%;
            cursor: pointer; 
            border-radius: var(--radius-md); 
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.25);
            transition: all var(--transition-smooth);
            letter-spacing: 0.3px;
        }

        button:hover { 
            background: var(--accent-hover); 
            box-shadow: 0 6px 20px rgba(211, 84, 0, 0.35);
            transform: scale(1.01);
        }

        button:active {
            transform: scale(0.99);
        }

        /* Empty/Error State Card Styles */
        .status-message {
            grid-column: 1 / -1;
            padding: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: var(--radius-lg);
            border: 2px dashed rgba(92, 44, 6, 0.15);
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <header>
        <h1>Clara's Best: Kakanin Delicacies</h1>
        <div class="info-container">
            <div class="info">📍 Poblacion, Hinunangan Southern Leyte</div>
            <div class="info">📞 09686911702</div>
            <div class="info">📧 jiajinbax911@gmail.com</div>
        </div>
        <div class="info-container" style="margin-top: 5px;">
            <div class="info">FB: Mary Claire Co-Baximen</div>
        </div>
        
        <!-- Dynamic user status bar injected safely into the header -->
        <div id="auth-status-bar" class="nav-status"></div>
    </header>

    <h2 class="section-title">Our Native Delicacies</h2>
    <div class="grid" id="product-container"></div>
</div>

<script>
    // Global runtime variable tracking active authorization states
    let userSession = { loggedIn: false, role: null };

    // 1. VERIFY AUTHENTICATION STATE AGAINST THE RUNNING NODE.JS ENGINE
    async function checkUserSession() {
        try {
            const response = await fetch('/api/session');
            const sessionData = await response.json();
            
            const statusBar = document.getElementById('auth-status-bar');
            
            if (sessionData.loggedIn) {
                userSession.loggedIn = true;
                userSession.role = sessionData.user.role;
                
                // Determine target redirection profile panel
                let panelUrl = '/customer.html';
                if (userSession.role === 'Admin') panelUrl = '/admin.html';
                if (userSession.role === 'Staff') panelUrl = '/staff.html';

                statusBar.innerHTML = `
                    <span style="color: #f3e5ab; font-weight: 500;">Mabuhay, ${sessionData.user.name}! (${userSession.role})</span>
                    <a href="${panelUrl}" style="color: #fff; border-bottom: 1px dashed #fff;">Go to Dashboard</a>
                    <a href="#" onclick="processLogout(event)" style="color: #ff7675; font-weight: 600;">Logout</a>
                `;
            } else {
                userSession.loggedIn = false;
                userSession.role = null;
                statusBar.innerHTML = `<a href="/login.html" style="color: #f3e5ab;">Customer Login / Sign Up</a>`;
            }
        } catch (error) {
            console.error("Session sync down:", error);
            document.getElementById('auth-status-bar').innerHTML = `<a href="/login.html" style="color: #f3e5ab;">Customer Login / Sign Up</a>`;
        }
    }

    // 2. LOAD PRODUCTS DIRECTLY FROM THE AIVEN BACKEND DATABASE
    async function loadProducts() {
        try {
            const res = await fetch('/api/products');
            const products = await res.json();
            const container = document.getElementById('product-container');
            
            if(products.length === 0) {
                container.innerHTML = `
                    <div class="status-message">
                        <p>No products available right now. Check back later!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="card">
                    <div>
                        <h3>${p.name}</h3>
                        <p class="description">${p.description}</p>
                    </div>
                    <div style="width: 100%;">
                        <p class="price-tag">₱${parseFloat(p.price).toFixed(2)}</p>
                        <p class="stock-tag">Available Stock: ${p.stock_quantity}</p>
                        <button onclick="handleAction()">Add to Cart / Order</button>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error("Error pulling product array:", error);
            document.getElementById('product-container').innerHTML = `
                <div class="status-message" style="border-color: #ffcbd1; background-color: rgba(255,235,235,0.95);">
                    <p style="color: #d63031; font-weight: 600;">Unable to connect to service registry.</p>
                </div>
            `;
        }
    }

    // 3. INTERCEPT INTERACTION ATTACKS REQUIRING SECURE LOGINS
    function handleAction() {
        if (!userSession.loggedIn) {
            alert("To place an order, make a reservation, or add items to your cart, please log in or sign up first.");
            window.location.href = '/login.html';
        } else {
            // Divert routing based on user permissions
            if (userSession.role === 'Customer') {
                window.location.href = '/customer.html';
            } else if (userSession.role === 'Staff') {
                window.location.href = '/staff.html';
            } else if (userSession.role === 'Admin') {
                window.location.href = '/admin.html';
            }
        }
    }

    // 4. LOGOUT REMIT REQUEST EXECUTION
    async function processLogout(event) {
        event.preventDefault();
        const check = await fetch('/api/logout');
        if (check.ok) {
            alert("Logged out successfully.");
            window.location.reload();
        }
    }

    // Self-starting initialization triggers
    async function initPage() {
        await checkUserSession();
        await loadProducts();
    }

    initPage();
</script>
</body>
</html>
