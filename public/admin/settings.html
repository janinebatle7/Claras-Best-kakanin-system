<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara's Best - System Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #3d0c11;
            --primary-mid: #5c1820;
            --accent-gold: #cca43b;
            --bg-light: #fdfaf6;
            --bg-card: #ffffff;
            --text-dark: #2d1518;
            --text-muted: #7d6769;
            --border-color: #f1eae2;
            --success-green: #16a34a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
        }

        /* --- SIDEBAR NAVIGATION DESIGNS --- */
        .sidebar {
            width: 260px;
            background-color: var(--primary-dark);
            color: #ffffff;
            padding: 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.05);
            z-index: 100;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            background-color: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo::after {
            content: "👑";
            font-size: 20px;
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--bg-light);
            letter-spacing: 0.5px;
        }

        .admin-panel-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: 16px;
            font-weight: 600;
            padding-left: 8px;
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #e2d4d5;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .sidebar-menu li a:hover, 
        .sidebar-menu li.active a {
            background-color: var(--primary-mid);
            color: #ffffff;
            font-weight: 500;
        }

        .sidebar-menu li.active a i {
            color: var(--accent-gold);
        }

        .sidebar-menu li.logout-btn {
            margin-top: auto;
            padding-top: 24px;
        }

        .sidebar-menu li.logout-btn a {
            color: #fca5a5;
        }

        .sidebar-menu li.logout-btn a:hover {
            background-color: #7f1d1d;
            color: #ffffff;
        }

        .footer-branding {
            margin-top: 40px;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.6;
            line-height: 1.5;
            padding: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- CONTENT BODY PANELS --- */
        .main-content {
            margin-left: 260px;
            flex: 1;
            width: calc(100% - 260px);
            padding: 40px;
            overflow-x: hidden;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .page-title h1 {
            font-size: 1.85rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        /* --- PANEL INTERACTION CONTROLS --- */
        .table-container {
            width: 100%;
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 0.92rem;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            background-color: #fdfdfd;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        select:focus, input[type="number"]:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(204, 164, 59, 0.1);
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-mid);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            background-color: var(--primary-dark);
        }

        .action-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="brand-section">
            <div class="brand-logo"></div>
            <div class="brand-name">Clara's Best</div>
        </div>
        <div class="admin-panel-tag">Admin Panel</div>
        <ul class="sidebar-menu">
            <li><a href="admin.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="users.html"><i class="fa-solid fa-users"></i> Users</a></li>
            <li><a href="products.html"><i class="fa-solid fa-cookie-bite"></i> Products</a></li>
            <li><a href="orders.html"><i class="fa-solid fa-shopping-bag"></i> Orders</a></li>
            <li><a href="reservations.html"><i class="fa-solid fa-calendar-check"></i> Reservations</a></li>
            <li><a href="cancellation.html"><i class="fa-solid fa-ban"></i> Cancellation Requests</a></li>
            <li><a href="inventory.html"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a></li>
            <li><a href="payments.html"><i class="fa-solid fa-credit-card"></i> Payments</a></li>
            <li><a href="reports.html"><i class="fa-solid fa-file-invoice-dollar"></i> Reports</a></li>
            <li class="active"><a href="settings.html"><i class="fa-solid fa-sliders"></i> Settings</a></li>
            <li class="logout-btn"><a href="#logout" id="logoutBtn" onclick="processLogout(event)"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
        <div class="footer-branding">
            <strong>Clara's Best: Kakanin Delicacies</strong><br>
            Poblacion, Hinunangan, Southern Leyte
        </div>
    </nav>

    <main class="main-content">
        <div class="header-container">
            <div class="page-title">
                <h1>System Settings</h1>
            </div>
        </div>
        
        <div class="table-container" style="max-width: 600px; padding: 32px;">
            <form id="settingsForm">
                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="storeStatus">Store Status</label>
                    <select id="storeStatus">
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 30px;">
                    <label for="deliveryFee">Base Delivery Fee (₱)</label>
                    <input type="number" id="deliveryFee" step="0.01" min="0" value="3.00">
                </div>
                <button type="submit" class="action-btn" id="saveBtn">
                    <i class="fa-solid fa-floppy-disk"></i> Save Configurations
                </button>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadConfigurations();

            // Intercept form submission to apply application state updates
            document.getElementById('settingsForm').addEventListener('submit', (e) => {
                e.preventDefault();
                saveConfigurations();
            });

            // Handle clean administrator session destruction
            const logoutLink = document.getElementById('logoutBtn');
            if (logoutLink) {
                logoutLink.addEventListener('click', async (e) => {
                    e.preventDefault();
                    await processLogout(e);
                });
            }
        });

        // Pull saved preferences from client cache layers cleanly
        function loadConfigurations() {
            try {
                const savedStatus = localStorage.getItem('claras_store_status') || 'Open';
                const savedFee = localStorage.getItem('claras_delivery_fee') || '3.00';

                document.getElementById('storeStatus').value = savedStatus;
                document.getElementById('deliveryFee').value = parseFloat(savedFee).toFixed(2);
            } catch (err) {
                console.error('Failed to parse system configuration profiles:', err);
            }
        }

        // Commit configuration rows and simulate UI change confirmation states
        function saveConfigurations() {
            const statusInput = document.getElementById('storeStatus').value;
            const feeInput = document.getElementById('deliveryFee').value;
            const saveBtn = document.getElementById('saveBtn');

            try {
                localStorage.setItem('claras_store_status', statusInput);
                localStorage.setItem('claras_delivery_fee', parseFloat(feeInput || 0).toFixed(2));

                // Quick satisfying feedback state modification
                const originalContent = saveBtn.innerHTML;
                saveBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Configurations Saved! ✓';
                saveBtn.style.backgroundColor = "var(--success-green)";
                saveBtn.disabled = true;

                setTimeout(() => {
                    saveBtn.innerHTML = originalContent;
                    saveBtn.style.backgroundColor = "";
                    saveBtn.disabled = false;
                }, 2000);

            } catch (err) {
                console.error('Could not overwrite active cache variables:', err);
                alert('Failed to preserve local operational attributes. Check browser privacy levels.');
            }
        }

        // Session logout routine execution block
        async function processLogout(event) {
            if (event) event.preventDefault();
            if (!confirm("Are you sure you want to end your current session and sign out?")) return;

            try {
                const check = await fetch('/api/logout');
                if (check.ok) {
                    alert("Logged out successfully.");
                    // Updated from local template location string to direct absolute root endpoint route context
                    window.location.href = '/login.html';
                } else {
                    alert("Failed to close remote web session clean on server.");
                }
            } catch (error) {
                console.error("Logout runtime error network connection failure:", error);
                alert("Network connection drop detected. Could not execute structural logout configurations.");
            }
        }
    </script>
</body>
</html>
