<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Admin</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="brand-section">
            <div class="brand-logo"></div>
            <div class="brand-name">Clara's Best</div>
        </div>
        <ul class="sidebar-menu">
            <li><a href="admin.html">Dashboard</a></li>
            <li><a href="users.html">Users</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="reservations.html">Reservations</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="payments.html">Payments</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li class="active"><a href="settings.html">Settings</a></li>
            <li class="logout-btn"><a href="#logout" id="logoutBtn">Logout</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <div class="header-container">
            <div class="page-title"><h1>System Settings</h1></div>
        </div>
        <div class="table-container" style="max-width: 600px; padding: 20px;">
            <form id="settingsForm">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">Store Status</label>
                    <select id="storeStatus" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">Base Delivery Fee (₱)</label>
                    <input type="number" id="deliveryFee" step="0.01" min="0" value="3.00" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;">
                </div>
                <button type="submit" class="action-btn" id="saveBtn">Save Configurations</button>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadConfigurations();

            // Intercept form submission to apply application state updates
            document.getElementById('settingsForm').addEventListener('submit', (e) => {
                e.preventDefault();
                saveConfigurations();
            });

            // Handle clean administrator session destruction
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/logout');
                    if (res.ok) window.location.href = 'login.html';
                } catch (err) {
                    console.error('Logout script execution failure:', err);
                }
            });
        });

        // Pull saved preferences from client cache layers cleanly
        function loadConfigurations() {
            try {
                const savedStatus = localStorage.getItem('claras_store_status') || 'Open';
                const savedFee = localStorage.getItem('claras_delivery_fee') || '3.00';

                document.getElementById('storeStatus').value = savedStatus;
                document.getElementById('deliveryFee').value = parseFloat(savedFee).toFixed(2);
            } catch (err) {
                console.error('Failed to parse system configuration profiles:', err);
            }
        }

        // Commit configuration rows and simulate UI change confirmation states
        function saveConfigurations() {
            const statusInput = document.getElementById('storeStatus').value;
            const feeInput = document.getElementById('deliveryFee').value;
            const saveBtn = document.getElementById('saveBtn');

            try {
                localStorage.setItem('claras_store_status', statusInput);
                localStorage.setItem('claras_delivery_fee', parseFloat(feeInput || 0).toFixed(2));

                // Quick satisfying feedback state modification
                const originalText = saveBtn.textContent;
                saveBtn.textContent = "Configurations Saved! ✓";
                saveBtn.style.backgroundColor = "#2ecc71";
                saveBtn.disabled = true;

                setTimeout(() => {
                    saveBtn.textContent = originalText;
                    saveBtn.style.backgroundColor = "";
                    saveBtn.disabled = false;
                }, 2000);

            } catch (err) {
                console.error('Could not overwrite active cache variables:', err);
                alert('Failed to preserve local operational attributes. Check browser privacy levels.');
            }
        }
    </script>
</body>
</html>
