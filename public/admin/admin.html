<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara's Best - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8B4513; --primary-light: #d2691e; --sidebar-bg: #2d1e18; --bg-main: #faf7f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: #fff; padding: 24px 16px; flex-shrink: 0; }
        .sidebar-brand { font-size: 20px; font-weight: 700; margin-bottom: 32px; padding-left: 12px; border-left: 4px solid var(--primary-light); }
        .menu-item { padding: 12px 16px; margin-bottom: 6px; cursor: pointer; border-radius: 8px; color: #b0a49c; font-weight: 600; transition: 0.2s; }
        .menu-item:hover, .menu-item.active { background-color: var(--primary-light); color: #fff; }
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .view-section { display: none; }
        .view-section.active-view { display: block; }
        .card { background: white; padding: 24px; border-radius: 12px; border: 1px solid #e6ded9; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #f9f9f9; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-brand">Clara's Best Admin</div>
        <div onclick="switchView('dashboard', this)" class="menu-item active">Dashboard</div>
        <div onclick="switchView('users', this)" class="menu-item">Users</div>
        <div onclick="switchView('products', this)" class="menu-item">Products</div>
        <div onclick="switchView('orders', this)" class="menu-item">Orders</div>
        <div onclick="switchView('payments', this)" class="menu-item">Payments</div>
        <div onclick="handleLogout()" class="menu-item" style="color: #ff8a8a; margin-top: auto;">Logout</div>
    </nav>

    <main class="main-content">
        <section id="dashboard" class="view-section active-view">
            <h2>Dashboard Overview</h2>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
                <div class="card"><h3>Total Revenue</h3><p id="dash-sales" style="font-size:24px; font-weight:700;">₱0.00</p></div>
                <div class="card"><h3>Pending Orders</h3><p id="dash-pending" style="font-size:24px; font-weight:700;">0</p></div>
            </div>
        </section>

        <section id="users" class="view-section">
            <h2>User Management</h2>
            <div class="card">
                <table id="users-table">
                    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr></thead>
                    <tbody id="users-body"></tbody>
                </table>
            </div>
        </section>

        <section id="products" class="view-section">
            <h2>Product Management</h2>
            <div class="card">
                <table id="products-table">
                    <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th></tr></thead>
                    <tbody id="products-body"></tbody>
                </table>
            </div>
        </section>

        <section id="orders" class="view-section">
            <h2>Live Order Queue</h2>
            <div class="card">
                <table id="orders-table">
                    <thead><tr><th>ID</th><th>Customer</th><th>Status</th><th>Action</th></tr></thead>
                    <tbody id="orders-body"></tbody>
                </table>
            </div>
        </section>

        <section id="payments" class="view-section"><h2>Payments Ledger</h2><div class="card">Review GCash and Cash records.</div></section>
    </main>

    <script>
        function switchView(viewId, element) {
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active-view'));
            document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById(viewId).classList.add('active-view');
            element.classList.add('active');
            
            // Trigger specific loaders
            if(viewId === 'orders') fetchOrders();
            if(viewId === 'dashboard') fetchDashboardMetrics();
            if(viewId === 'users') fetchUsers();
            if(viewId === 'products') fetchProducts();
        }

        async function fetchDashboardMetrics() {
            const res = await fetch('/api/admin/sales');
            const data = await res.json();
            document.getElementById('dash-sales').innerText = '₱' + data.totalSales;
            document.getElementById('dash-pending').innerText = data.pendingOrders;
        }

        async function fetchUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            document.getElementById('users-body').innerHTML = users.map(u => `
                <tr><td>${u.id}</td><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td></tr>`).join('');
        }

        async function fetchProducts() {
            const res = await fetch('/api/products');
            const prods = await res.json();
            document.getElementById('products-body').innerHTML = prods.map(p => `
                <tr><td>${p.id}</td><td>${p.name}</td><td>₱${p.price}</td><td>${p.stock}</td></tr>`).join('');
        }

        async function fetchOrders() {
            const res = await fetch('/api/orders');
            const orders = await res.json();
            document.getElementById('orders-body').innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id}</td><td>${o.customer_name}</td><td>${o.order_status}</td>
                    <td><button onclick="updateOrderStatus(${o.id})">Update</button></td>
                </tr>`).join('');
        }

        async function updateOrderStatus(id) {
            const status = prompt("Set status to (e.g., Ready, Delivered):");
            if(!status) return;
            await fetch(`/api/orders/${id}`, { 
                method: 'PUT', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ order_status: status }) 
            });
            fetchOrders();
        }

        async function handleLogout() {
            await fetch('/api/logout');
            window.location.href = '/login.html';
        }

        window.onload = fetchDashboardMetrics;
    </script>
</body>
</html>
