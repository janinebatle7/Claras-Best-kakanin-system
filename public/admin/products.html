<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Admin</title>
    <link rel="stylesheet" href="admin-style.css">
    <style>
        /* Small styling safety layer for dynamic layout rendering */
        .product-thumbnail {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #9ca3af;
        }
        .action-btn-danger {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
            font-size: 14px;
        }
        .action-btn-danger:hover {
            background-color: #b91c1c;
        }

        /* --- PRODUCT MODAL STYLING --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid #e6ded9;
        }
        .modal-box h2 {
            margin-bottom: 20px;
            color: var(--primary-color, #8B4513);
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2d1e18;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e6ded9;
            border-radius: 6px;
            font-size: 14px;
            background: #faf7f5;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color, #8B4513);
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }
        .cancel-btn {
            background: #e6ded9;
            color: #4a3e3d;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .cancel-btn:hover {
            background: #d8ceeb;
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="brand-section">
            <div class="brand-logo"></div>
            <div class="brand-name">Clara's Best</div>
        </div>
        <ul class="sidebar-menu">
            <li><a href="admin.html">Dashboard</a></li>
            <li><a href="users.html">Users</a></li>
            <li class="active"><a href="products.html">Products</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="reservations.html">Reservations</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="payments.html">Payments</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li class="logout-btn"><a href="#logout" onclick="processLogout(event)">Logout</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <div class="header-container">
            <div class="page-title"><h1>Product Management</h1></div>
            <button class="action-btn" onclick="openAddProductModal()">+ Add New Product</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 20px; color: #64748b;">
                            Synchronizing products repository catalogue...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="productModal">
        <div class="modal-box">
            <h2 id="modalTitle">Add New Product</h2>
            <form id="productForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="targetProductId" value="">

                <div class="form-group">
                    <label for="prodName">Product Name</label>
                    <input type="text" id="prodName" required placeholder="e.g., Puto">
                </div>
                <div class="form-group">
                    <label for="prodCategory">Category</label>
                    <select id="prodCategory" required>
                        <option value="Rice Cake">Rice Cake</option>
                        <option value="Pudding">Pudding</option>
                        <option value="Delicacy">Delicacy</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="prodPrice">Price (₱)</label>
                    <input type="number" id="prodPrice" step="0.01" min="0" required placeholder="0.00">
                </div>
                <div class="form-group" id="stockGroup">
                    <label for="prodStock">Initial Stock Quantity</label>
                    <input type="number" id="prodStock" min="0" required placeholder="100">
                </div>
                <div class="form-group">
                    <label for="prodImageUrl">Image URL (Optional)</label>
                    <input type="text" id="prodImageUrl" placeholder="e.g., /images/puto.jpg">
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeProductModal()">Cancel</button>
                    <button type="submit" class="action-btn" id="submitModalBtn">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Global in-memory cache registry to serve fast editing actions
        let productsCache = [];

        // 1. Fetch products from database row data registries cleanly
        async function fetchProductsList() {
            try {
                const response = await fetch('/api/products');
                if (!response.ok) throw new Error("Failed to capture structural inventory values.");

                productsCache = await response.json();
                const tableBody = document.getElementById('products-table-body');

                if (productsCache.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px; color: #64748b;">No products found in the catalog.</td></tr>`;
                    return;
                }

                // Render database lines into structured table iterations
                tableBody.innerHTML = productsCache.map(product => {
                    const imageElement = product.image_url 
                        ? `<img src="${product.image_url}" alt="${product.name}" class="product-thumbnail" onerror="this.onerror=null; this.parentElement.innerHTML='🥞';">`
                        : `<div class="product-thumbnail">🥞</div>`;

                    return `
                        <tr>
                            <td>${imageElement}</td>
                            <td style="font-weight: 600;">${product.name}</td>
                            <td>${product.description || 'Kakanin'}</td>
                            <td style="font-weight: bold; color: var(--primary-color, #8B4513);">₱${Number(product.price).toFixed(2)}</td>
                            <td>
                                <button class="action-btn" onclick="editProduct(${product.id})">Edit</button>
                                <button class="action-btn-danger" onclick="deleteProduct(${product.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error("Products listing load error failure:", error);
                document.getElementById('products-table-body').innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 20px; color: #dc2626; font-weight: bold;">
                            Error running component records sync routine.
                        </td>
                    </tr>`;
            }
        }

        // 2. Modal Interface Toggle Controllers
        function openAddProductModal() {
            document.getElementById('modalTitle').textContent = "Add New Product";
            document.getElementById('submitModalBtn').textContent = "Save Product";
            document.getElementById('targetProductId').value = "";
            document.getElementById('stockGroup').style.display = "block"; // Required for new item inputs
            document.getElementById('productForm').reset();
            document.getElementById('productModal').style.display = 'flex';
        }

        function editProduct(productId) {
            const product = productsCache.find(p => p.id === productId);
            if (!product) return alert("Product data structure not found in memory stack cache.");

            document.getElementById('modalTitle').textContent = "Modify Product Settings";
            document.getElementById('submitModalBtn').textContent = "Update Configurations";
            document.getElementById('targetProductId').value = product.id;
            
            // Populating active fields securely
            document.getElementById('prodName').value = product.name;
            document.getElementById('prodCategory').value = product.description || "Rice Cake";
            document.getElementById('prodPrice').value = product.price;
            document.getElementById('prodStock').value = product.stock_quantity;
            document.getElementById('prodImageUrl').value = product.image_url || "";

            document.getElementById('productModal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('productModal').style.display = 'none';
            document.getElementById('productForm').reset();
        }

        // 3. Unified Request Dispatch Routing (Handles Create vs Update checking patterns)
        async function handleFormSubmit(event) {
            event.preventDefault();

            const productId = document.getElementById('targetProductId').value;
            const payload = {
                name: document.getElementById('prodName').value,
                category: document.getElementById('prodCategory').value,
                price: parseFloat(document.getElementById('prodPrice').value),
                stock_quantity: parseInt(document.getElementById('prodStock').value || 0),
                image_url: document.getElementById('prodImageUrl').value || null
            };

            const url = productId ? `/api/products/${productId}` : '/api/products';
            const method = productId ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Could not commit operations layout cleanly to server tables.");

                alert(productId ? "Product properties updated successfully!" : "Product saved successfully!");
                closeProductModal();
                fetchProductsList(); // Refresh view state instantly

            } catch (error) {
                console.error("Product modification processing breakdown error:", error);
                alert("Error handling request operations: " + error.message);
            }
        }

        // 4. Client Side Deletion Router
        async function deleteProduct(productId) {
            const product = productsCache.find(p => p.id === productId);
            const productName = product ? product.name : `ID: #${productId}`;
            
            if (!confirm(`Are you absolutely sure you want to permanently remove "${productName}" from the menu catalog?`)) return;

            try {
                // Utilizing your custom PUT schema updating logic to clear or drop items if a hard DELETE route isn't set up yet
                const response = await fetch(`/api/products/${productId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: product.name,
                        category: "Archived / Hidden",
                        price: product.price,
                        stock_quantity: 0, // Wipe remaining operational asset registers
                        image_url: product.image_url
                    })
                });

                if (!response.ok) throw new Error("Database state alteration rejected by core auth boundaries.");

                alert(`"${productName}" has been successfully removed from view registries.`);
                fetchProductsList();

            } catch (error) {
                console.error("Product lifecycle drop handler breakdown:", error);
                alert("Could not update selected row instance logs: " + error.message);
            }
        }

        // 5. Clear session references cleanly
       async function processLogout(event) {
            event.preventDefault();
            if (!confirm("Are you sure you want to end your current session and sign out?")) return;

            try {
                const check = await fetch('/api/logout');
                if (check.ok) {
                    alert("Logged out successfully.");
                    // Updated from local template location string to direct absolute root endpoint route context
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error("Logout runtime error network connection failure:", error);
            }
        }
        window.onload = fetchProductsList;
    </script>
</body>
</html>
