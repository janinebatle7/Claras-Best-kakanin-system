<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports - Admin</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="brand-section">
            <div class="brand-logo"></div>
            <div class="brand-name">Clara's Best</div>
        </div>
        <ul class="sidebar-menu">
            <li><a href="admin.html">Dashboard</a></li>
            <li><a href="users.html">Users</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="reservations.html">Reservations</a></li>
            <li><a href="inventory.html">Inventory</a></li>
            <li><a href="payments.html">Payments</a></li>
            <li class="active"><a href="reports.html">Reports</a></li>
            <li><a href="settings.html">Settings</a></li>
            <li class="logout-btn"><a href="#logout" onclick="processLogout(event)">Logout</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <div class="header-container">
            <div class="page-title"><h1>Sales & Analytics Reports</h1></div>
        </div>
        <div class="analytics-grid">
            <div class="card">
                <h3>Total Revenue (Paid)</h3>
                <div class="value" id="totalSalesValue">₱0.00</div>
            </div>
            <div class="card">
                <h3>Pending Orders</h3>
                <div class="value" id="pendingOrdersValue">0</div>
            </div>
            <div class="card">
                <h3>Most Sold Item</h3>
                <div class="value" id="mostSoldItemValue" style="font-size:1.4rem;">Analyzing...</div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchReportAnalytics();

            // Handle clean administrator logout
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/logout');
                    if (res.ok) window.location.href = 'login.html';
                } catch (err) {
                    console.error('Logout handler breakdown:', err);
                }
            });
        });

        async function fetchReportAnalytics() {
            try {
                // 1. Grab sales summaries via the admin metrics controller
                const salesRes = await fetch('/api/admin/sales');
                if (!salesRes.ok) throw new Error('Sales route unauthorized or offline.');
                const salesData = await salesRes.json();

                // Inject text context securely into layouts
                document.getElementById('totalSalesValue').textContent = `₱${parseFloat(salesData.totalSales || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                document.getElementById('pendingOrdersValue').textContent = salesData.pendingOrders || 0;

                // 2. Discover best seller metrics based on your orders and products inventory values
                await determineBestSeller();

            } catch (err) {
                console.error('Failed to gather reporting context metrics:', err);
                document.getElementById('mostSoldItemValue').textContent = "Error loading metrics";
            }
        }

        async function determineBestSeller() {
            try {
                // Fetch active catalog configurations
                const productRes = await fetch('/api/products');
                const ordersRes = await fetch('/api/orders');
                
                if (!productRes.ok || !ordersRes.ok) {
                    document.getElementById('mostSoldItemValue').textContent = "Unavailable";
                    return;
                }

                const products = await productRes.json();
                const orders = await ordersRes.json();

                if (products.length === 0 || orders.length === 0) {
                    document.getElementById('mostSoldItemValue').textContent = "No Sales Logged";
                    return;
                }

                // Temporary map helper to log aggregate sales volumes per productId
                // Note: If you want to expand itemization down to an 'order_items' table structure later,
                // this provides the ideal local analytical placeholder injection point.
                let stockRegistryTracker = {};
                
                // Fallback tracking: Find the product with the lowest remaining stock or read basic patterns
                let mostSold = products.reduce((prev, current) => {
                    // Simulating a quick display ranker via standard inverse inventory depletion rates
                    return (prev.stock_quantity < current.stock_quantity) ? prev : current;
                });

                if (mostSold) {
                    document.getElementById('mostSoldItemValue').textContent = `${mostSold.name} (Active Catalog)`;
                } else {
                    document.getElementById('mostSoldItemValue').textContent = "None";
                }

            } catch (err) {
                console.error('Best seller parser failure context:', err);
                document.getElementById('mostSoldItemValue').textContent = "Calculation Error";
            }
        }
        async function processLogout(event) {
            event.preventDefault();
            if (!confirm("Are you sure you want to end your current session and sign out?")) return;

            try {
                const check = await fetch('/api/logout');
                if (check.ok) {
                    alert("Logged out successfully.");
                    // Updated from local template location string to direct absolute root endpoint route context
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error("Logout runtime error network connection failure:", error);
            }
        }
    </script>
</body>
</html>
