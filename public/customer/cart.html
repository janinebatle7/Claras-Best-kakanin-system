<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara's Best - Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #78350f; --primary-light: #b45309; --primary-accent: #fef3c7; --bg-main: #fafaf9; --sidebar-bg: #ffffff; --text-dark: #1c1917; --text-muted: #78716c; --border: #e7e5e4; --radius-lg: 16px; --radius-sm: 8px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); display: flex; }
        
        /* Sidebar */
        .sidebar { width: 280px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 32px 20px; position: fixed; height: 100vh; }
        .sidebar-brand { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 40px; padding-left: 12px; border-left: 4px solid var(--primary-light); }
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; list-style: none; }
        .menu-item { display: flex; align-items: center; padding: 14px 16px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px; border-radius: var(--radius-sm); }
        .menu-item:hover, .menu-item.active { color: var(--primary); background-color: var(--primary-accent); }
        
        /* Main Content */
        .main-content { flex-grow: 1; margin-left: 280px; padding: 48px; }
        .card { background: white; padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 24px; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .data-table th, .data-table td { padding: 16px; border-bottom: 1px solid var(--border); }
        .data-table th { background: #faf9f6; color: var(--primary); font-weight: 700; }
        
        /* Forms */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; color: var(--text-muted); }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; }
        .btn { padding: 10px 20px; font-weight: 700; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--primary-light); color: white; width: 100%; }
        .btn-primary:hover { background: var(--primary); }
        .btn-secondary { background: #f5f5f4; border: 1px solid var(--border); margin: 0 4px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-brand">Clara's Best</div>
        <ul class="sidebar-menu">
            <li><a href="customer.html" class="menu-item">Home</a></li>
            <li><a href="products.html" class="menu-item">Products</a></li>
            <li><a href="cart.html" class="menu-item active">Cart</a></li>
            <li><a href="orders.html" class="menu-item">My Orders</a></li>
            <li><a href="reservation.html" class="menu-item">My Reservations</a></li>
            <li><a href="cancellation.html" class="menu-item">Cancellations</a></li>
            <li><a href="payment.html" class="menu-item">Payments</a></li>
            <li><a href="profile.html" class="menu-item">Profile</a></li>
            <li class="logout-btn"><a href="#logout" onclick="processLogout(event)">Logout</a></li>
        </ul>
    </nav>
    <main class="main-content">
        <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 32px;">Your Shopping Cart</h2>
        <div class="card">
            <div class="table-responsive">
                <table class="data-table">
                    <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Action</th></tr></thead>
                    <tbody id="cart-tbody"></tbody>
                </table>
            </div>
            <div style="text-align: right; margin-bottom: 32px; font-size: 20px; font-weight: 800;">
                Total: <span id="cart-total-display" style="color: var(--primary-light);">₱0.00</span>
            </div>
            
            <div id="checkout-form-area" style="display: none; border-top: 1px solid var(--border); padding-top: 24px;">
                <div class="form-group">
                    <label>Fulfillment Type</label>
                    <select id="checkout-type" class="form-control">
                        <option value="Order">Standard Purchase Order</option>
                        <option value="Reservation">Advanced Reservation</option>
                    </select>
                </div>
                <div class="form-group" id="reservation-date-group" style="display: none;">
                    <label>Target Collection Date & Time</label>
                    <input type="datetime-local" id="checkout-date" class="form-control">
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="checkout-method" class="form-control">
                        <option value="Cash">Cash on Pickup</option>
                        <option value="GCash">GCash Transfer</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="submitCheckout()">Place Order / Booking</button>
            </div>
        </div>
    </main>

    <script>
        let cart = JSON.parse(localStorage.getItem('userCart')) || [];
        
        function renderCart() {
            const tbody = document.getElementById('cart-tbody');
            const formArea = document.getElementById('checkout-form-area');
            const totalDisplay = document.getElementById('cart-total-display');
            
            if (cart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">Your cart is empty.</td></tr>`;
                formArea.style.display = 'none';
                totalDisplay.innerText = "₱0.00";
                return;
            }

            tbody.innerHTML = '';
            formArea.style.display = 'block';
            let total = 0;
            
            cart.forEach(item => {
                const sub = item.price * item.quantity;
                total += sub;
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.name}</strong></td>
                        <td>₱${parseFloat(item.price).toFixed(2)}</td>
                        <td>
                            <button class="btn btn-secondary" onclick="updateQty(${item.product_id}, -1)">-</button>
                            <span style="font-weight:700; margin:0 8px;">${item.quantity}</span>
                            <button class="btn btn-secondary" onclick="updateQty(${item.product_id}, 1)">+</button>
                        </td>
                        <td>₱${sub.toFixed(2)}</td>
                        <td><button class="btn btn-secondary" style="color:#b91c1c;" onclick="updateQty(${item.product_id}, -999)">Remove</button></td>
                    </tr>`;
            });
            totalDisplay.innerText = `₱${total.toFixed(2)}`;
        }

        function updateQty(id, mod) {
            const idx = cart.findIndex(i => i.product_id === id);
            if (idx > -1) {
                if (mod === -999) cart.splice(idx, 1);
                else {
                    cart[idx].quantity += mod;
                    if (cart[idx].quantity <= 0) cart.splice(idx, 1);
                }
            }
            localStorage.setItem('userCart', JSON.stringify(cart));
            renderCart();
        }

        document.getElementById('checkout-type').addEventListener('change', (e) => {
            document.getElementById('reservation-date-group').style.display = e.target.value === 'Reservation' ? 'block' : 'none';
        });

        async function submitCheckout() {
            const type = document.getElementById('checkout-type').value;
            const pickup_date_time = document.getElementById('checkout-date').value;
            
            if (type === 'Reservation' && !pickup_date_time) return alert("Please select a date for your reservation.");

            const payload = { 
                items: cart, 
                type, 
                payment_method: document.getElementById('checkout-method').value, 
                pickup_date_time: pickup_date_time || new Date().toISOString().slice(0, 19).replace('T', ' ')
            };

            try {
                const res = await fetch('/api/orders', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                if (res.ok) {
                    alert("Order placed successfully!");
                    localStorage.removeItem('userCart');
                    window.location.href = type === 'Reservation' ? 'reservation.html' : 'orders.html';
                } else {
                    const error = await res.json();
                    alert("Error: " + error.error);
                }
            } catch(err) { console.error(err); alert("Failed to connect to server."); }
        }
async function processLogout(event) {
            event.preventDefault();
            if (!confirm("Are you sure you want to end your current session and sign out?")) return;

            try {
                const check = await fetch('/api/logout');
                if (check.ok) {
                    alert("Logged out successfully.");
                    // Updated from local template location string to direct absolute root endpoint route context
                    window.location.href = '/login.html';
                }
            } catch (error) {
                console.error("Logout runtime error network connection failure:", error);
            }
        }
        window.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
