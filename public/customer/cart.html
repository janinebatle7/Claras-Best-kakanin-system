<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara's Best - Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #78350f; 
            --primary-light: #b45309; 
            --primary-accent: #fef3c7; 
            --bg-main: #fafaf9; 
            --sidebar-bg: #ffffff; 
            --text-dark: #1c1917; 
            --text-muted: #78716c; 
            --border: #e7e5e4; 
            --radius-lg: 16px; 
            --radius-sm: 8px; 
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); display: flex; }
        
        /* Sidebar Layout styling */
        .sidebar { width: 280px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 32px 20px; position: fixed; height: 100vh; }
        .sidebar-brand { font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 40px; padding-left: 12px; border-left: 4px solid var(--primary-light); }
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; list-style: none; }
        .menu-item { display: flex; align-items: center; padding: 14px 16px; color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 14px; border-radius: var(--radius-sm); transition: var(--transition-smooth); }
        .menu-item:hover, .menu-item.active { color: var(--primary); background-color: var(--primary-accent); }
        
        /* Main Content Structure */
        .main-content { flex-grow: 1; margin-left: 280px; padding: 48px; min-height: 100vh; }
        .card { background: white; padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 24px; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .data-table th, .data-table td { padding: 16px; border-bottom: 1px solid var(--border); transition: var(--transition-smooth); }
        .data-table th { background: #faf9f6; color: var(--primary); font-weight: 700; }
        
        /* Modernized Interactive Rows */
        .cart-row { opacity: 0; transform: translateY(8px); transition: var(--transition-smooth); }
        .cart-row.rendered { opacity: 1; transform: translateY(0); }
        
        /* Input & Form Control Fields */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: inherit; font-size: 14px; color: var(--text-dark); background-color: #ffffff; transition: var(--transition-smooth); }
        .form-control:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.1); }
        
        /* Buttons */
        .btn { padding: 10px 20px; font-weight: 700; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition-smooth); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
        .btn-primary { background: var(--primary-light); color: white; width: 100%; padding: 14px; font-size: 15px; }
        .btn-primary:hover { background: var(--primary); box-shadow: 0 4px 12px rgba(120, 53, 15, 0.15); }
        .btn-primary:active { transform: scale(0.99); }
        
        .btn-secondary { background: #f5f5f4; border: 1px solid var(--border); margin: 0 4px; color: var(--text-dark); }
        .btn-secondary:hover { background: #e7e5e4; border-color: var(--text-muted); }
        .btn-secondary:active { transform: scale(0.95); }
        
        #checkout-form-area { transition: var(--transition-smooth); }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-brand">Clara's Best</div>
        <ul class="sidebar-menu">
            <li><a href="customer.html" class="menu-item">Home</a></li>
            <li><a href="products.html" class="menu-item">Products</a></li>
            <li><a href="cart.html" class="menu-item active">Cart</a></li>
            <li><a href="orders.html" class="menu-item">My Orders</a></li>
            <li><a href="reservation.html" class="menu-item">My Reservations</a></li>
            <li><a href="cancellation.html" class="menu-item">Cancellations</a></li>
            <li><a href="payment.html" class="menu-item">Payments</a></li>
            <li><a href="profile.html" class="menu-item">Profile</a></li>
            <li class="logout-btn"><a href="#logout" class="menu-item" id="logout-trigger">Logout</a></li>
        </ul>
    </nav>
    
    <main class="main-content">
        <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 32px; font-family: 'Georgia', serif; color: var(--primary);">Your Shopping Cart</h2>
        <div class="card">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-tbody"></tbody>
                </table>
            </div>
            
            <div style="text-align: right; margin-bottom: 32px; font-size: 20px; font-weight: 800;">
                Total: <span id="cart-total-display" style="color: var(--primary-light);">₱0.00</span>
            </div>
            
            <div id="checkout-form-area" style="display: none; border-top: 1px solid var(--border); padding-top: 24px;">
                <div class="form-group">
                    <label for="checkout-type">Fulfillment Type</label>
                    <select id="checkout-type" class="form-control">
                        <option value="Order">Standard Purchase Order</option>
                        <option value="Reservation">Advanced Reservation</option>
                    </select>
                </div>
                <div class="form-group" id="reservation-date-group" style="display: none;">
                    <label for="checkout-date">Target Collection Date & Time</label>
                    <input type="datetime-local" id="checkout-date" class="form-control">
                </div>
                <div class="form-group">
                    <label for="checkout-method">Payment Method</label>
                    <select id="checkout-method" class="form-control">
                        <option value="Cash">Cash on Pickup</option>
                        <option value="GCash">GCash Transfer</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="btn-submit-checkout">Place Order / Booking</button>
            </div>
        </div>
    </main>

    <script>
        // Localized instance variables targeting memory stack collections
        let cart = [];

        /**
         * Safely registers script triggers on pipeline initialization completes
         */
        document.addEventListener('DOMContentLoaded', () => {
            initializeCartState();
            
            // Centralized Event Listeners
            const typeSelector = document.getElementById('checkout-type');
            if (typeSelector) {
                typeSelector.addEventListener('change', handleFulfillmentToggle);
            }

            const checkoutBtn = document.getElementById('btn-submit-checkout');
            if (checkoutBtn) {
                checkoutBtn.addEventListener('click', submitCheckout);
            }

            const logoutBtn = document.getElementById('logout-trigger');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', processLogout);
            }
        });

        /**
         * Synchronizes local state arrays safely with localStorage caches
         */
        function initializeCartState() {
            try {
                cart = JSON.parse(localStorage.getItem('userCart')) || [];
            } catch (e) {
                console.error("Local client cart string compilation tracking error:", e);
                cart = [];
            }
            renderCart();
        }

        /**
         * Assembles dynamic item lists inside an out-of-DOM document fragment
         */
        function renderCart() {
            const tbody = document.getElementById('cart-tbody');
            const formArea = document.getElementById('checkout-form-area');
            const totalDisplay = document.getElementById('cart-total-display');
            
            if (!tbody || !formArea || !totalDisplay) return;

            if (cart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted); font-style: italic;">Your cart is empty.</td></tr>`;
                formArea.style.display = 'none';
                totalDisplay.innerText = "₱0.00";
                return;
            }

            tbody.innerHTML = '';
            formArea.style.display = 'block';
            let total = 0;
            
            const tableFragment = document.createDocumentFragment();

            cart.forEach((item, idx) => {
                const sub = (parseFloat(item.price) || 0) * (parseInt(item.quantity) || 0);
                total += sub;
                
                const safeName = escapeHtml(item.name || 'Homemade Delicacy');
                const safePrice = (parseFloat(item.price) || 0).toFixed(2);
                const safeSubtotal = sub.toFixed(2);
                const itemId = parseInt(item.product_id);

                const tr = document.createElement('tr');
                tr.className = 'cart-row';
                tr.innerHTML = `
                    <td><strong>${safeName}</strong></td>
                    <td>₱${safePrice}</td>
                    <td>
                        <button class="btn btn-secondary btn-qty-minus" data-id="${itemId}">-</button>
                        <span style="font-weight:700; margin:0 8px; display:inline-block; min-width:16px; text-align:center;">${item.quantity}</span>
                        <button class="btn btn-secondary btn-qty-plus" data-id="${itemId}">+</button>
                    </td>
                    <td>₱${safeSubtotal}</td>
                    <td><button class="btn btn-secondary btn-remove" style="color:#b91c1c;" data-id="${itemId}">Remove</button></td>
                `;

                // Append local click listeners directly to the individual button targets
                tr.querySelector('.btn-qty-minus').addEventListener('click', () => updateQty(itemId, -1));
                tr.querySelector('.btn-qty-plus').addEventListener('click', () => updateQty(itemId, 1));
                tr.querySelector('.btn-remove').addEventListener('click', () => updateQty(itemId, -999));

                tableFragment.appendChild(tr);
                
                // Triggers structural transition fade smoothly using execution ticks
                setTimeout(() => tr.classList.add('rendered'), idx * 40);
            });
            
            tbody.appendChild(tableFragment);
            totalDisplay.innerText = `₱${total.toFixed(2)}`;
        }

        /**
         * Mutates product quantity properties securely based on event updates
         */
        function updateQty(id, mod) {
            const idx = cart.findIndex(i => parseInt(i.product_id) === id);
            if (idx > -1) {
                if (mod === -999) {
                    cart.splice(idx, 1);
                } else {
                    cart[idx].quantity = (parseInt(cart[idx].quantity) || 0) + mod;
                    if (cart[idx].quantity <= 0) {
                        cart.splice(idx, 1);
                    }
                }
                localStorage.setItem('userCart', JSON.stringify(cart));
                renderCart();
            }
        }

        /**
         * Monitors dropdown selection toggles to cleanly manage reservation elements
         */
        function handleFulfillmentToggle(e) {
            const dateGroup = document.getElementById('reservation-date-group');
            if (dateGroup) {
                dateGroup.style.display = e.target.value === 'Reservation' ? 'block' : 'none';
            }
        }

        /**
         * Validates payload integrity and posts checkout details to backend endpoints
         */
        async function submitCheckout() {
            const type = document.getElementById('checkout-type').value;
            const pickup_date_time = document.getElementById('checkout-date').value;
            
            if (type === 'Reservation' && !pickup_date_time) {
                alert("Please select a date for your reservation.");
                return;
            }

            // Defaults standard checkout configurations cleanly if left unmodified
            const finalPickupTime = pickup_date_time || new Date().toISOString().slice(0, 19).replace('T', ' ');

            const payload = { 
                items: cart, 
                type, 
                payment_method: document.getElementById('checkout-method').value, 
                pickup_date_time: finalPickupTime
            };

            try {
                const res = await fetch('/api/orders', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                
                if (res.ok) {
                    alert("✨ Order placed successfully!");
                    localStorage.removeItem('userCart');
                    window.location.href = type === 'Reservation' ? 'reservation.html' : 'orders.html';
                } else {
                    const error = await res.json();
                    alert("Order Issue: " + (error.error || 'Server rejected request parsing structure.'));
                }
            } catch(err) { 
                console.error("Critical channel failure sending order transaction packets:", err); 
                alert("Failed to connect to server. Please check your data channels."); 
            }
        }

        /**
         * Terminates current active user validation records
         */
        async function processLogout(event) {
            event.preventDefault();
            if (!confirm("Are you sure you want to end your current session and sign out?")) return;

            try {
                const check = await fetch('/api/logout');
                if (check.ok) {
                    alert("Logged out successfully.");
                    window.location.href = '/login.html';
                } else {
                    alert("Clearance refused by session server.");
                }
            } catch (error) {
                console.error("Session logout transmission fault:", error);
                window.location.href = '/login.html'; // Direct escape routing line fallback override
            }
        }

        /**
         * Escapes structural strings safely to prevent script injections
         */
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
