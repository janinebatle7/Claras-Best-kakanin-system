<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Ledger - Staff</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .summary-card { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-box { background: var(--primary); color: white; padding: 20px; border-radius: 10px; flex: 1; }
        .stat-box h3 { margin: 0; font-size: 0.9rem; opacity: 0.9; }
        .stat-box p { margin: 5px 0 0; font-size: 1.5rem; font-weight: bold; }
        
        .status-verified { color: #28a745; font-weight: bold; }
        .amount-text { font-family: 'Courier New', Courier, monospace; font-weight: 600; color: #333; }
        .refresh-btn { background: #444; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Staff Portal</h2>
        <a href="staff.html" class="menu-item">Dashboard</a>
        <a href="orders.html" class="menu-item">Orders</a>
        <a href="reservations.html" class="menu-item">Reservations</a>
        <a href="walk.html" class="menu-item">Walk-in Orders</a>
        <a href="inventory.html" class="menu-item">Inventory</a>
        <a href="payment.html" class="menu-item active">Payments</a>
        <a href="#" onclick="logout()" class="menu-item" style="color:#ff8a8a; margin-top: 50px;">Logout</a>
    </div>

    <main class="content">
        <h1>Payment Ledger</h1>
        
        <div class="summary-card">
            <div class="stat-box">
                <h3>Total Processed Today</h3>
                <p id="total-sum">₱0.00</p>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadPayments()">Refresh Ledger</button>
        
        <div class="card">
            <table id="pay-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Amount Paid</th>
                        <th>Date Processed</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="pay-body">
                    <tr><td colspan="4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        async function loadPayments() {
            try {
                const res = await fetch('/api/payments');
                const data = await res.json();
                const payBody = document.getElementById('pay-body');
                const totalDisplay = document.getElementById('total-sum');

                if (data.length === 0) {
                    payBody.innerHTML = '<tr><td colspan="4">No payment records found.</td></tr>';
                    totalDisplay.innerText = "₱0.00";
                    return;
                }

                // Calculate total revenue
                const total = data.reduce((sum, p) => sum + parseFloat(p.amount_paid || 0), 0);
                totalDisplay.innerText = `₱${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

                // Render table
                payBody.innerHTML = data.map(p => `
                    <tr>
                        <td>#${p.order_id}</td>
                        <td class="amount-text">₱${parseFloat(p.amount_paid).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        <td>${new Date(p.paid_at).toLocaleDateString()}</td>
                        <td class="status-verified">✓ Verified</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error loading payments:", err);
            }
        }

        async function logout() {
            await fetch('/api/logout');
            window.location.href = '/login.html';
        }

        window.onload = loadPayments;
        // Refresh ledger automatically every minute
        setInterval(loadPayments, 60000);
    </script>
</body>
</html>
