<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Ledger - Staff</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Summary Metric Card layout tweaks to tie with style.css tokens */
        .summary-card { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-box { 
            background: var(--accent); 
            color: white; 
            padding: 25px; 
            border-radius: var(--radius-lg); 
            flex: 1; 
            box-shadow: 0 4px 14px rgba(92, 29, 36, 0.12);
        }
        .stat-box h3 { margin: 0; font-size: 0.85rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
        .stat-box p { margin: 8px 0 0; font-size: 1.8rem; font-weight: bold; font-family: 'Georgia', serif; }
        
        /* Interactive UI Element Controls */
        .refresh-btn { 
            background: var(--accent); 
            color: white; 
            padding: 10px 18px; 
            border: none; 
            border-radius: var(--radius-md); 
            cursor: pointer; 
            margin-bottom: 20px; 
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition-fast);
            box-shadow: 0 2px 4px 0 rgba(92, 29, 36, 0.06);
        }
        .refresh-btn:hover { 
            background: var(--accent-hover); 
            box-shadow: 0 4px 12px rgba(92, 29, 36, 0.15);
        }
        .refresh-btn:active {
            transform: scale(0.97);
        }

        /* Ledger Table Context Modifiers */
        .status-verified { 
            color: #137333; 
            font-weight: 700; 
            background: #e6f4ea;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            display: inline-block;
        }
        .amount-text { 
            font-weight: 700; 
            color: var(--text-main); 
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Clara's Best</h2>
        <a href="staff.html" class="menu-item">Dashboard</a>
        <a href="orders.html" class="menu-item">Orders</a>
        <a href="reservations.html" class="menu-item">Reservations</a>
        <a href="walk.html" class="menu-item">Walk-in Orders</a>
        <a href="inventory.html" class="menu-item">Inventory</a>
        <a href="payment.html" class="menu-item active">Payments</a>
        <a href="#" onclick="logout(event)" class="menu-item" style="color:#b91c1c; margin-top: auto;">Logout</a>
    </div>

    <main class="content">
        <div class="header-container">
            <h1 style="font-family: 'Georgia', serif; color: var(--accent); font-size: 2rem; margin-bottom: 20px;">Payment Ledger</h1>
        </div>
        
        <div class="summary-card">
            <div class="stat-box">
                <h3>Total Processed Today</h3>
                <p id="total-sum">₱0.00</p>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadPayments()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            Refresh Ledger
        </button>
        
        <div class="table-container">
            <table id="pay-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Amount Paid</th>
                        <th>Date Processed</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="pay-body">
                    <tr><td colspan="4" style="text-align: center; padding: 20px; color: var(--text-muted);">Loading system payment tracking items...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        /**
         * Safely registers foundational tracking loops once HTML elements completely load
         */
        document.addEventListener('DOMContentLoaded', () => {
            loadPayments();
            // Refresh ledger automatically every minute cleanly
            setInterval(loadPayments, 60000);
        });

        /**
         * Pulls dynamic collection streams and renders aggregates onto metrics selectors
         */
        async function loadPayments() {
            try {
                const res = await fetch('/api/payments');
                if (!res.ok) throw new Error(`HTTP Pipeline verification failure: ${res.status}`);
                
                const data = await res.json();
                const payBody = document.getElementById('pay-body');
                const totalDisplay = document.getElementById('total-sum');

                if (!data || data.length === 0) {
                    payBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: var(--text-muted);">No payment records found.</td></tr>';
                    totalDisplay.innerText = "₱0.00";
                    return;
                }

                // Calculate total revenue securely processing database inputs safely
                const total = data.reduce((sum, p) => sum + (parseFloat(p?.amount_paid) || 0), 0);
                totalDisplay.innerText = `₱${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                // Render matching data grid layout row matrices
                payBody.innerHTML = data.map(p => {
                    const safePaidVal = parseFloat(p?.amount_paid) || 0;
                    const dateObj = p?.paid_at ? new Date(p.paid_at) : new Date();
                    const safeDate = !isNaN(dateObj.getTime()) ? dateObj.toLocaleDateString() : new Date().toLocaleDateString();
                    const safeOrderId = p?.order_id ? `#${p.order_id}` : 'N/A';

                    return `
                        <tr>
                            <td><strong>${safeOrderId}</strong></td>
                            <td class="amount-text">₱${safePaidVal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            <td>${safeDate}</td>
                            <td><span class="status-verified">✓ Verified</span></td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error("Error synchronizing active ledger system summaries:", err);
                const payBody = document.getElementById('pay-body');
                if (payBody) {
                    payBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 20px; color: #b91c1c;">Failed to load data metrics from sales channels.</td></tr>';
                }
            }
        }

        /**
         * Clears security access cookies and maps viewport out to login systems
         * @param {Event} e - Tracking action context intercept block
         */
        async function logout(e) {
            if (e && typeof e.preventDefault === 'function') e.preventDefault();
            try {
                await fetch('/api/logout');
                window.location.href = '/login.html';
            } catch (err) {
                console.error("Logout runtime trace exception dropped:", err);
                window.location.href = '/login.html'; // Invariant fallback target line
            }
        }
    </script>
</body>
</html>
